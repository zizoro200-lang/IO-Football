<script>
/* ============================================================
   إعدادات Supabase
============================================================ */
const SUPABASE_URL = "https://mdcerlwdlnpsisektwbe.supabase.co";

/* ============================================================
   أدوات مطابقة الإجابات
============================================================ */
function normalizeArabic(str){
  return (str||"")
    .trim()
    .toLowerCase()
    .replace(/[إأآا]/g,"ا")
    .replace(/ى/g,"ي")
    .replace(/ة/g,"ه")
    .replace(/ؤ/g,"و")
    .replace(/ئ/g,"ي")
    .replace(/[ًٌٍَُِّْـ]/g,"")
    .replace(/[^\u0600-\u06FFa-z0-9\s]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(m===0) return n; if(n===0) return m;
  const dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function fuzzyMatch(input, candidate){
  const a = normalizeArabic(input), b = normalizeArabic(candidate);
  if(!a || !b) return false;
  if(a===b) return true;
  if(a.length>=3 && (b.includes(a) || a.includes(b))) return true;
  const dist = levenshtein(a,b);
  const thresh = b.length<=4 ? 1 : (b.length<=8 ? 2 : 3);
  return dist<=thresh;
}
// answersData: [{id, canonical_name, accepted_variants: [...]}]
function findMatchingAnswerId(input, answersData, alreadyUsedIds){
  for(const ans of answersData){
    if(alreadyUsedIds.has(ans.id)) continue;
    for(const v of ans.accepted_variants){
      if(fuzzyMatch(input, v)) return ans.id;
    }
  }
  return null;
}

/* ============================================================
   إعدادات اللعبة
============================================================ */
const TOTAL_ROUNDS = 5;
const DURATION_OPTIONS = [30, 45, 60, 90];

function genRoomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s="";
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function genDevicePlayerId(){
  return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
}

/* ============================================================
   State
============================================================ */
let myDevicePlayerId = localStorage.getItem('fd_device_id');
if(!myDevicePlayerId){
  myDevicePlayerId = genDevicePlayerId();
  localStorage.setItem('fd_device_id', myDevicePlayerId);
}
let myName = localStorage.getItem('fd_player_name') || "";

let currentRoom = null;         // row from rooms table
let myRoomPlayer = null;        // row from room_players (me)
let oppRoomPlayer = null;       // row from room_players (opponent)

let currentQuestionAnswers = []; // rows from question_answers
let currentRoomRound = null;    // row from room_rounds
let myAnswers = [];             // rows from round_answers (mine, this round)
let oppAnswers = [];            // rows from round_answers (opponent, this round)
let allRoundScores = {};        // round_number -> {winner_room_player_id, is_draw, meCorrect, oppCorrect}

let pollTimer = null;
let roundTimerInterval = null;
let toastTimeout = null;
let realtimeChannel = null;
let questionsCache = []; // all questions+answers preloaded once

const root = document.getElementById('app');

function showToast(msg){
  clearTimeout(toastTimeout);
  let t = document.querySelector('.toast');
  if(t) t.remove();
  t = document.createElement('div');
  t.className='toast';
  t.textContent = msg;
  document.body.appendChild(t);
  toastTimeout = setTimeout(()=>t.remove(), 2400);
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s||"";
  return d.innerHTML;
}

/* ============================================================
   تحميل الأسئلة (مرة واحدة، عشوائي)
============================================================ */
async function loadRandomQuestions(n){
  const { data: qData, error: qErr } = await sb
    .from('questions')
    .select('id, question_text, category, difficulty, total_answers_count')
    .eq('is_active', true);
  if(qErr || !qData || qData.length===0){
    showToast("مشكلة في تحميل الأسئلة، حاول تاني");
    return [];
  }
  // shuffle & pick n
  const shuffled = [...qData].sort(()=>Math.random()-0.5);
  const chosen = shuffled.slice(0, n);

  const results = [];
  for(const q of chosen){
    const { data: aData } = await sb
      .from('question_answers')
      .select('id, canonical_name, accepted_variants, sort_order')
      .eq('question_id', q.id)
      .order('sort_order', {ascending:true});
    results.push({ question: q, answers: aData || [] });
  }
  return results;
}

/* ============================================================
   Router / render
============================================================ */
function render(){
  if(!currentRoom){
    renderHome();
  } else if(currentRoom.status === 'waiting'){
    renderWaiting();
  } else if(currentRoom.status === 'playing'){
    renderGame();
  } else if(currentRoom.status === 'round_result'){
    renderRoundResult();
  } else if(currentRoom.status === 'finished'){
    renderFinal();
  } else {
    renderLoadingScreen();
  }
}

function renderLoadingScreen(msg){
  root.innerHTML = `

}

          أو

        <div class="stack" style="gap:10px;">
          <input type="text" id="codeInput" placeholder="كود الغرفة" maxlength="5" style="text-transform:uppercase;">
          <button class="btn btn-ghost" id="joinBtn">🔑 انضمام لغرفة</button>

  document.getElementById('nameInput').addEventListener('input', e=>{

async function handleCreateRoom(){
  if(!myName.trim()){ showToast("اكتب اسمك الأول 👋"); return; }
  const btn = document.getElementById('createBtn');
  btn.disabled = true; btn.textContent = "بنجهز الغرفة...";

  try{
    let code, exists;
    do{
      code = genRoomCode();
      const { data } = await sb.from('rooms').select('id').eq('code', code).maybeSingle();
      exists = !!data;
    }while(exists);

    const { data: room, error: roomErr } = await sb.from('rooms').insert({
      code,
      status: 'waiting',
      round_duration_seconds: selectedDuration,
      total_rounds: TOTAL_ROUNDS,
      current_round: 0
    }).select().single();

    if(roomErr || !room){ throw roomErr; }

    const { data: player, error: playerErr } = await sb.from('room_players').insert({
      room_id: room.id,
      player_name: myName.trim(),
      device_player_id: myDevicePlayerId
    }).select().single();

    if(playerErr || !player){ throw playerErr; }

    await sb.from('rooms').update({ created_by: player.id }).eq('id', room.id);

    currentRoom = room;
    myRoomPlayer = player;
    subscribeRealtime(room.id);
    startPolling();
    render();
  }catch(err){
    console.error(err);
    showToast("حصل خطأ، حاول تاني");
    btn.disabled=false; btn.textContent="🏟️ إنشاء غرفة جديدة";
  }
}

async function handleJoinRoom(){
  if(!myName.trim()){ showToast("اكتب اسمك الأول 👋"); return; }
  const codeInput = document.getElementById('codeInput');
  const code = codeInput.value.trim().toUpperCase();
  if(code.length < 4){ showToast("اكتب كود الغرفة صح"); return; }

  const btn = document.getElementById('joinBtn');
  btn.disabled = true; btn.textContent = "بندخل...";

  try{
    const { data: room } = await sb.from('rooms').select('*').eq('code', code).maybeSingle();
    if(!room){
      showToast("مفيش غرفة بالكود ده 🙁");
      btn.disabled=false; btn.textContent="🔑 انضمام لغرفة";
      return;
    }

    const { data: existingPlayers } = await sb.from('room_players').select('*').eq('room_id', room.id);
    let me = existingPlayers.find(p=>p.device_player_id===myDevicePlayerId);

    if(!me){
      if(existingPlayers.length >= 2){
        showToast("الغرفة مكتملة بالفعل 👥");
        btn.disabled=false; btn.textContent="🔑 انضمام لغرفة";
        return;
      }
      const { data: newPlayer, error: joinErr } = await sb.from('room_players').insert({
        room_id: room.id,
        player_name: myName.trim(),
        device_player_id: myDevicePlayerId
      }).select().single();
      if(joinErr){ throw joinErr; }
      me = newPlayer;

      // لو دلوقتي بقى فيه لاعبين، ابدأ اللعبة
      const { data: allPlayers } = await sb.from('room_players').select('*').eq('room_id', room.id);
      if(allPlayers.length === 2){
        await startGameForRoom(room, allPlayers);
      }
    }

    const { data: freshRoom } = await sb.from('rooms').select('*').eq('id', room.id).single();
    currentRoom = freshRoom;
    myRoomPlayer = me;
    subscribeRealtime(room.id);
    startPolling();
    render();
  }catch(err){
    console.error(err);
    showToast("حصل خطأ، حاول تاني");
    btn.disabled=false; btn.textContent="🔑 انضمام لغرفة";
  }
}

async function startGameForRoom(room, players){
  // اختار كل أسئلة الماتش مرة واحدة وخزنها في الغرفة نفسها (مش في متغير محلي)
  // عشان أي لاعب (منشئ الغرفة أو صاحبه) يقدر ياخد السؤال التالي بثقة
  const picked = await loadRandomQuestions(room.total_rounds);
  if(picked.length === 0){
    showToast("مشكلة في تحميل الأسئلة، حاول تاني");
    return;
  }
  const questionIds = picked.map(p=>p.question.id);
  questionsCache = picked;

  const { data: roundRow } = await sb.from('room_rounds').insert({
    room_id: room.id,
    round_number: 1,
    question_id: questionIds[0],
    started_at: new Date().toISOString()
  }).select().single();

  await sb.from('rooms').update({
    status: 'playing',
    current_round: 0,
    round_started_at: roundRow.started_at,
    question_ids: questionIds,
    updated_at: new Date().toISOString()
  }).eq('id', room.id);
}

async function loadCurrentRoundData(){
  const { data: players } = await sb.from('room_players').select('*').eq('room_id', currentRoom.id).order('joined_at');
  myRoomPlayer = players.find(p=>p.device_player_id===myDevicePlayerId) || myRoomPlayer;
  oppRoomPlayer = players.find(p=>p.device_player_id!==myDevicePlayerId) || null;

  const roundNumber = currentRoom.current_round + 1;
  const { data: roundRow } = await sb.from('room_rounds').select('*').eq('room_id', currentRoom.id).eq('round_number', roundNumber).maybeSingle();
  if(!roundRow) return false;
  currentRoomRound = roundRow;

  const { data: q } = await sb.from('questions').select('*').eq('id', roundRow.question_id).single();
  currentQuestion = q;

  const { data: answers } = await sb.from('question_answers').select('*').eq('question_id', q.id).order('sort_order');
  currentQuestionAnswers = answers || [];

  const { data: myAns } = await sb.from('round_answers').select('*').eq('room_round_id', roundRow.id).eq('room_player_id', myRoomPlayer.id).order('submitted_at');
  myAnswers = myAns || [];

  if(oppRoomPlayer){
    const { data: oppAns } = await sb.from('round_answers').select('*').eq('room_round_id', roundRow.id).eq('room_player_id', oppRoomPlayer.id).order('submitted_at');
    oppAnswers = oppAns || [];
  } else {
    oppAnswers = [];
  }
  return true;
}

async function submitAnswer(text){
  text = (text||"").trim();
  if(!text || !currentRoomRound) return;

  const alreadyMatchedIds = new Set(myAnswers.filter(a=>a.matched_question_answer_id).map(a=>a.matched_question_answer_id));
  const alreadyTexts = new Set(myAnswers.map(a=>normalizeArabic(a.answer_text)));
  if(alreadyTexts.has(normalizeArabic(text))){
    showToast("كتبت الإجابة دي قبل كده");
    const inp = document.getElementById('answerInput');
    if(inp) inp.value='';
    return;
  }

  const matchedId = findMatchingAnswerId(text, currentQuestionAnswers, alreadyMatchedIds);
  const isCorrect = !!matchedId;

  const { data: inserted, error } = await sb.from('round_answers').insert({
    room_round_id: currentRoomRound.id,
    room_player_id: myRoomPlayer.id,
    answer_text: text,
    matched_question_answer_id: matchedId,
    is_correct: isCorrect
  }).select().single();

  if(!error && inserted){
    myAnswers.push(inserted);
  }

  const input = document.getElementById('answerInput');
  if(input){ input.value=''; }
  renderGame();

  // تحقق فوري لو الوقت خلص أو لازم تحسم الجولة
  await maybeResolveRound();
}

async function maybeResolveRound(){
  if(!currentRoomRound || currentRoom.status !== 'playing') return;
  const startedAt = new Date(currentRoomRound.started_at).getTime();
  const elapsed = Math.floor((Date.now()-startedAt)/1000);
  const timeUp = elapsed >= currentRoom.round_duration_seconds;
  if(!timeUp) return;
  if(currentRoomRound.ended_at) return; // already resolved

  // إعادة التحميل من القاعدة عشان نتأكد من آخر حالة (تفادي السباق بين اللاعبين)
  const { data: freshRound } = await sb.from('room_rounds').select('*').eq('id', currentRoomRound.id).single();
  if(freshRound.ended_at) return; // already resolved by opponent's client

  const { data: allAnswers } = await sb.from('round_answers').select('*').eq('room_round_id', currentRoomRound.id);
  const { data: players } = await sb.from('room_players').select('*').eq('room_id', currentRoom.id).order('joined_at');
  const [p1, p2] = players;
  const c1 = allAnswers.filter(a=>a.room_player_id===p1.id && a.is_correct).length;
  const c2 = p2 ? allAnswers.filter(a=>a.room_player_id===p2.id && a.is_correct).length : 0;

  let winnerId = null;
  let isDraw = false;
  if(c1>c2) winnerId = p1.id;
  else if(c2>c1) winnerId = p2 ? p2.id : null;
  else isDraw = true;

  // محاولة تحديث الجولة (لو حد تاني سبقنا هيفشل بصمت لإنه هيلاقيها متحدثة، مفيش تعارض خطير هنا)
  const { error: updateErr } = await sb.from('room_rounds')
    .update({ ended_at: new Date().toISOString(), winner_room_player_id: winnerId, is_draw: isDraw })
    .eq('id', currentRoomRound.id)
    .is('ended_at', null); // فقط لو لسه ماتحدثتش

  if(!updateErr){
    if(winnerId){
      const winner = players.find(p=>p.id===winnerId);
      await sb.from('room_players').update({ total_rounds_won: (winner.total_rounds_won||0)+1 }).eq('id', winnerId);
    }
    await sb.from('rooms').update({ status:'round_result', updated_at: new Date().toISOString() }).eq('id', currentRoom.id);
  }

  await refreshRoomState();
}

function startRoundTimerLoop(){
  clearInterval(roundTimerInterval);
  roundTimerInterval = setInterval(async ()=>{
    if(!currentRoomRound || currentRoom.status!=='playing'){ clearInterval(roundTimerInterval); return; }
    const startedAt = new Date(currentRoomRound.started_at).getTime();
    const elapsed = Math.floor((Date.now()-startedAt)/1000);
    const duration = currentRoom.round_duration_seconds;
    const remaining = Math.max(0, duration-elapsed);
    const clockTime = document.getElementById('clockTime');
    const clockFill = document.getElementById('clockFill');
    if(clockTime) clockTime.textContent = remaining + 's';
    if(clockFill){
      const pct = Math.max(0, Math.min(100,(remaining/duration)*100));
      clockFill.style.width = pct + '%';
      if(remaining<=10) clockFill.classList.add('urgent');
    }
    if(remaining<=0){
      clearInterval(roundTimerInterval);
      const input = document.getElementById('answerInput');
      const btn = document.getElementById('submitAnswerBtn');
      if(input) input.disabled = true;
      if(btn) btn.disabled = true;
      await maybeResolveRound();
    }
  }, 1000);
}

          const need = currentRoom.total_rounds - questionIds.length;
          const fresh = await loadRandomQuestions(need);
          const newIds = fresh.map(f=>f.question.id).filter(id=>!questionIds.includes(id));
          questionIds = [...questionIds, ...newIds];
          await sb.from('rooms').update({ question_ids: questionIds }).eq('id', currentRoom.id);
        }

        const nextQuestionId = questionIds[nextRoundNum-1];
        if(!nextQuestionId){
          showToast("مشكلة في تجهيز السؤال، حاول تاني");
          btn.disabled=false; btn.textContent = 'الجولة الجاية ⚽';
          return;
        }

        // تأكد إن الجولة دي مش موجودة بالفعل (تفادي تكرار من اللاعبين الاتنين)
        const { data: existing } = await sb.from('room_rounds').select('id').eq('room_id', currentRoom.id).eq('round_number', nextRoundNum).maybeSingle();
        if(!existing){
          await sb.from('room_rounds').insert({
            room_id: currentRoom.id,
            round_number: nextRoundNum,
            question_id: nextQuestionId,
            started_at: new Date().toISOString()
          });
        }
        const { data: theRound } = await sb.from('room_rounds').select('*').eq('room_id', currentRoom.id).eq('round_number', nextRoundNum).single();
        await sb.from('rooms').update({
          status:'playing',
          current_round: currentRoom.current_round+1,
          round_started_at: theRound.started_at,
          updated_at: new Date().toISOString()
        }).eq('id', currentRoom.id);
      }
    }catch(err){
      console.error(err);
      showToast("حصل خطأ، حاول تاني");
      btn.disabled=false; btn.textContent = isLast ? 'شوف النتيجة النهائية 🏆' : 'الجولة الجاية ⚽';
      return;
    }
    await refreshRoomState();
  });
}

/* ---------- FINAL ---------- */
async function renderFinal(){
  const { data: players } = await sb.from('room_players').select('*').eq('room_id', currentRoom.id).order('joined_at');
  myRoomPlayer = players.find(p=>p.device_player_id===myDevicePlayerId) || myRoomPlayer;
  oppRoomPlayer = players.find(p=>p.device_player_id!==myDevicePlayerId);

  const myScore = myRoomPlayer.total_rounds_won||0;
  const oppScore = oppRoomPlayer ? (oppRoomPlayer.total_rounds_won||0) : 0;
  const iWon = myScore > oppScore;
  const draw = myScore === oppScore;

  const { data: allRounds } = await sb.from('room_rounds').select('*').eq('room_id', currentRoom.id).order('round_number');

  root.innerHTML = `
    <div class="screen">
      <div class="trophy">${draw ? '🤝' : (iWon ? '🏆' : '🥈')}</div>
      <h2 style="font-size:24px; text-align:center; margin-bottom:6px;">
        ${draw ? 'التعادل كان سيد الموقف!' : (iWon ? 'مبروك، كسبت الماتش!' : 'خسرت الماتش ده... جولة تانية؟')}
      </h2>
      <p class="small-note" style="margin-bottom:10px;">${escapeHtml(myRoomPlayer.player_name)} ضد ${oppRoomPlayer?escapeHtml(oppRoomPlayer.player_name):'؟'}</p>

      <div class="final-score-board">
        <div class="final-player ${iWon?'win':''}"><div class="num">${myScore}</div><div class="lbl">انت</div></div>
        <div class="vs-sep" style="font-size:16px;">VS</div>
        <div class="final-player ${!iWon && !draw?'win':''}"><div class="num">${oppScore}</div><div class="lbl">${oppRoomPlayer?escapeHtml(oppRoomPlayer.player_name):'؟'}</div></div>
      </div>

      <div class="rounds-track">
        ${allRounds.map(rr=>{
          let cls = 'round-dot ';
          if(rr.is_draw) cls+='done-draw';
          else if(rr.winner_room_player_id===myRoomPlayer.id) cls+='done-me';
          else cls+='done-opp';
          return `<div class="${cls}">${rr.round_number}</div>`;
        }).join('')}
      </div>

      <div class="stack" style="margin-top:16px;">
        <button class="btn btn-ghost" id="newRoomBtn">🏟️ غرفة جديدة</button>
      </div>
    </div>
  `;
  document.getElementById('newRoomBtn').addEventListener('click', leaveRoom);
}

/* ============================================================
   تحديث حالة الغرفة (يستخدم بعد أي تعديل محلي)
============================================================ */
async function refreshRoomState(){
  const { data: freshRoom } = await sb.from('rooms').select('*').eq('id', currentRoom.id).single();
  if(freshRoom) currentRoom = freshRoom;
  render();
}

/* ============================================================
   Realtime subscriptions
============================================================ */
function subscribeRealtime(roomId){
  unsubscribeRealtime();
  realtimeChannel = sb.channel('room-'+roomId)
    .on('postgres_changes', { event:'*', schema:'public', table:'rooms', filter:`id=eq.${roomId}` }, payload=>{
      currentRoom = payload.new;
      render();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'room_players', filter:`room_id=eq.${roomId}` }, payload=>{
      if(currentRoom && currentRoom.status==='waiting'){ render(); }
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'round_answers' }, payload=>{
      // تحديث لايف لعداد الخصم من غير ريفريش كامل للشاشة
      if(currentRoom && currentRoom.status==='playing'){
        updateLiveOpponentCounter();
      }
    })
    .subscribe();
}
function unsubscribeRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel=null; }
}

async function updateLiveOpponentCounter(){
  if(!currentRoomRound || !oppRoomPlayer) return;
  const { data: oppAns } = await sb.from('round_answers').select('*').eq('room_round_id', currentRoomRound.id).eq('room_player_id', oppRoomPlayer.id);
  oppAnswers = oppAns || [];
  const oppCorrect = oppAnswers.filter(a=>a.is_correct).length;
  const el1 = document.getElementById('oppCountLive');
  const el2 = document.getElementById('oppProgressNum');
  if(el1) el1.textContent = oppCorrect;
  if(el2) el2.textContent = oppCorrect;
}

/* ============================================================
   Polling احتياطي (لو Realtime تأخر أو الاتصال ضعيف)
============================================================ */
function startPolling(){
  stopPolling();
  pollTimer = setInterval(async ()=>{
    if(!currentRoom) return;
    const { data: freshRoom } = await sb.from('rooms').select('*').eq('id', currentRoom.id).single();
    if(!freshRoom) return;
    const changed = freshRoom.status !== currentRoom.status || freshRoom.current_round !== currentRoom.current_round || freshRoom.updated_at !== currentRoom.updated_at;
    currentRoom = freshRoom;
    if(changed){
      render();
    } else if(currentRoom.status==='playing'){
      await maybeResolveRound();
      updateLiveOpponentCounter();
    }
  }, 2500);
}
function stopPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = null;
  clearInterval(roundTimerInterval);
}

/* ============================================================
   init
============================================================ */
render();
</script>

/* ============================================================
   إعدادات Supabase
============================================================ */
const SUPABASE_URL = "https://mdcerlwdlnpsisektwbe.supabase.co";
const SUPABASE_KEY = "sb_publishable_yxxbgNWgVZb6-FnJA6tEvA_plrOcygY";

/* ============================================================
   أدوات مطابقة الإجابات
============================================================ */
function normalizeArabic(str){
  return (str||"")
    .trim()
    .toLowerCase()
    .replace(/[إأآا]/g,"ا")
    .replace(/ى/g,"ي")
    .replace(/ة/g,"ه")
    .replace(/ؤ/g,"و")
    .replace(/ئ/g,"ي")
    .replace(/[ًٌٍَُِّْـ]/g,"")
    .replace(/[^\u0600-\u06FFa-z0-9\s]/g,"")

    .trim();
}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(m===0) return n; if(n===0) return m;
  const dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function fuzzyMatch(input, candidate){
  const a = normalizeArabic(input), b = normalizeArabic(candidate);
  if(!a || !b) return false;
  if(a===b) return true;
  if(a.length>=3 && (b.includes(a) || a.includes(b))) return true;
  const dist = levenshtein(a,b);
  const thresh = b.length<=4 ? 1 : (b.length<=8 ? 2 : 3);
  return dist<=thresh;
}
// answersData: [{id, canonical_name, accepted_variants: [...]}]
function findMatchingAnswerId(input, answersData, alreadyUsedIds){
  for(const ans of answersData){
    if(alreadyUsedIds.has(ans.id)) continue;
    for(const v of ans.accepted_variants){
      if(fuzzyMatch(input, v)) return ans.id;
    }
  }
  return null;
}

async function loadRandomQuestions(n){
  const { data: qData, error: qErr } = await sb
    .from('questions')
    .select('id, question_text, category, difficulty, total_answers_count')
    .eq('is_active', true);
  if(qErr || !qData || qData.length===0){
    showToast("مشكلة في تحميل الأسئلة، حاول تاني");
    return [];
  }
  // shuffle & pick n
  const shuffled = [...qData].sort(()=>Math.random()-0.5);
  const chosen = shuffled.slice(0, n);

  const results = [];
  for(const q of chosen){
    const { data: aData } = await sb
      .from('question_answers')
      .select('id, canonical_name, accepted_variants, sort_order')
      .eq('question_id', q.id)
      .order('sort_order', {ascending:true});
    results.push({ question: q, answers: aData || [] });
  }
  return results;
}

async function handleCreateRoom(){
  if(!myName.trim()){ showToast("اكتب اسمك الأول 👋"); return; }
  const btn = document.getElementById('createBtn');
  btn.disabled = true; btn.textContent = "بنجهز الغرفة...";

  try{
    let code, exists;
    do{
      code = genRoomCode();
      const { data } = await sb.from('rooms').select('id').eq('code', code).maybeSingle();
      exists = !!data;
    }while(exists);

    const { data: room, error: roomErr } = await sb.from('rooms').insert({
      code,
      status: 'waiting',
      round_duration_seconds: selectedDuration,
      total_rounds: TOTAL_ROUNDS,
      current_round: 0
    }).select().single();

    if(roomErr || !room){ throw roomErr; }

    const { data: player, error: playerErr } = await sb.from('room_players').insert({
      room_id: room.id,
      player_name: myName.trim(),
      device_player_id: myDevicePlayerId
    }).select().single();

    if(playerErr || !player){ throw playerErr; }

    await sb.from('rooms').update({ created_by: player.id }).eq('id', room.id);

    currentRoom = room;
    myRoomPlayer = player;
    subscribeRealtime(room.id);
    startPolling();
    render();
  }catch(err){
    console.error(err);
    showToast("حصل خطأ، حاول تاني");
    btn.disabled=false; btn.textContent="🏟️ إنشاء غرفة جديدة";
  }
}

async function handleJoinRoom(){
  if(!myName.trim()){ showToast("اكتب اسمك الأول 👋"); return; }
  const codeInput = document.getElementById('codeInput');
  const code = codeInput.value.trim().toUpperCase();
  if(code.length < 4){ showToast("اكتب كود الغرفة صح"); return; }

  const btn = document.getElementById('joinBtn');
  btn.disabled = true; btn.textContent = "بندخل...";

  try{
    const { data: room } = await sb.from('rooms').select('*').eq('code', code).maybeSingle();
    if(!room){
      showToast("مفيش غرفة بالكود ده 🙁");
      btn.disabled=false; btn.textContent="🔑 انضمام لغرفة";
      return;
    }

    const { data: existingPlayers } = await sb.from('room_players').select('*').eq('room_id', room.id);
    let me = existingPlayers.find(p=>p.device_player_id===myDevicePlayerId);

    if(!me){
      if(existingPlayers.length >= 2){

        btn.disabled=false; btn.textContent="🔑 انضمام لغرفة";
        return;

        room_id: room.id,
        player_name: myName.trim(),
        device_player_id: myDevicePlayerId
      }).select().single();

      me = newPlayer;

      const { data: allPlayers } = await sb.from('room_players').select('*').eq('room_id', room.id);
      if(allPlayers.length === 2){
        await startGameForRoom(room, allPlayers);

    }

    const { data: freshRoom } = await sb.from('rooms').select('*').eq('id', room.id).single();
    currentRoom = freshRoom;
    myRoomPlayer = me;
    subscribeRealtime(room.id);
    startPolling();
    render();
  }catch(err){
    console.error(err);
    showToast("حصل خطأ، حاول تاني");
    btn.disabled=false; btn.textContent="🔑 انضمام لغرفة";
  }

  const picked = await loadRandomQuestions(room.total_rounds);

    current_round: 0,
    round_started_at: roundRow.started_at,
    question_ids: questionIds,
    updated_at: new Date().toISOString()
  }).eq('id', room.id);
}

async function submitAnswer(text){
  text = (text||"").trim();
  if(!text || !currentRoomRound) return;

  const alreadyMatchedIds = new Set(myAnswers.filter(a=>a.matched_question_answer_id).map(a=>a.matched_question_answer_id));
  const alreadyTexts = new Set(myAnswers.map(a=>normalizeArabic(a.answer_text)));
  if(alreadyTexts.has(normalizeArabic(text))){
    showToast("كتبت الإجابة دي قبل كده");
    const inp = document.getElementById('answerInput');
    if(inp) inp.value='';
    return;
  }

  const matchedId = findMatchingAnswerId(text, currentQuestionAnswers, alreadyMatchedIds);
  const isCorrect = !!matchedId;

  const { data: inserted, error } = await sb.from('round_answers').insert({
    room_round_id: currentRoomRound.id,
    room_player_id: myRoomPlayer.id,
    answer_text: text,
    matched_question_answer_id: matchedId,
    is_correct: isCorrect
  }).select().single();

  if(!error && inserted){
    myAnswers.push(inserted);
  }

  const input = document.getElementById('answerInput');
  if(input){ input.value=''; }
  renderGame();

  // تحقق فوري لو الوقت خلص أو لازم تحسم الجولة
  await maybeResolveRound();
}

async function maybeResolveRound(){
  if(!currentRoomRound || currentRoom.status !== 'playing') return;
  const startedAt = new Date(currentRoomRound.started_at).getTime();
  const elapsed = Math.floor((Date.now()-startedAt)/1000);
  const timeUp = elapsed >= currentRoom.round_duration_seconds;
  if(!timeUp) return;
  if(currentRoomRound.ended_at) return; // already resolved

  // إعادة التحميل من القاعدة عشان نتأكد من آخر حالة (تفادي السباق بين اللاعبين)
  const { data: freshRound } = await sb.from('room_rounds').select('*').eq('id', currentRoomRound.id).single();
  if(freshRound.ended_at) return; // already resolved by opponent's client

  const { data: allAnswers } = await sb.from('round_answers').select('*').eq('room_round_id', currentRoomRound.id);
  const { data: players } = await sb.from('room_players').select('*').eq('room_id', currentRoom.id).order('joined_at');
  const [p1, p2] = players;
  const c1 = allAnswers.filter(a=>a.room_player_id===p1.id && a.is_correct).length;
  const c2 = p2 ? allAnswers.filter(a=>a.room_player_id===p2.id && a.is_correct).length : 0;

  let winnerId = null;
  let isDraw = false;
  if(c1>c2) winnerId = p1.id;
  else if(c2>c1) winnerId = p2 ? p2.id : null;
  else isDraw = true;

  // محاولة تحديث الجولة (لو حد تاني سبقنا هيفشل بصمت لإنه هيلاقيها متحدثة، مفيش تعارض خطير هنا)
  const { error: updateErr } = await sb.from('room_rounds')
    .update({ ended_at: new Date().toISOString(), winner_room_player_id: winnerId, is_draw: isDraw })
    .eq('id', currentRoomRound.id)
    .is('ended_at', null); // فقط لو لسه ماتحدثتش

  if(!updateErr){
    if(winnerId){
      const winner = players.find(p=>p.id===winnerId);
      await sb.from('room_players').update({ total_rounds_won: (winner.total_rounds_won||0)+1 }).eq('id', winnerId);
    }
    await sb.from('rooms').update({ status:'round_result', updated_at: new Date().toISOString() }).eq('id', currentRoom.id);
  }

  await refreshRoomState();
}

function startRoundTimerLoop(){
  clearInterval(roundTimerInterval);
  roundTimerInterval = setInterval(async ()=>{
    if(!currentRoomRound || currentRoom.status!=='playing'){ clearInterval(roundTimerInterval); return; }
    const startedAt = new Date(currentRoomRound.started_at).getTime();
    const elapsed = Math.floor((Date.now()-startedAt)/1000);
    const duration = currentRoom.round_duration_seconds;
    const remaining = Math.max(0, duration-elapsed);
    const clockTime = document.getElementById('clockTime');
    const clockFill = document.getElementById('clockFill');
    if(clockTime) clockTime.textContent = remaining + 's';
    if(clockFill){
      const pct = Math.max(0, Math.min(100,(remaining/duration)*100));
      clockFill.style.width = pct + '%';
      if(remaining<=10) clockFill.classList.add('urgent');
    }
    if(remaining<=0){
      clearInterval(roundTimerInterval);
      const input = document.getElementById('answerInput');
      const btn = document.getElementById('submitAnswerBtn');
      if(input) input.disabled = true;
      if(btn) btn.disabled = true;
      await maybeResolveRound();
    }
  }, 1000);
}

/* ---------- ROUND RESULT ---------- */
async function renderRoundResult(){
  const { data: roundRow } = await sb.from('room_rounds').select('*').eq('room_id', currentRoom.id).eq('round_number', currentRoom.current_round+1).single();
  currentRoomRound = roundRow;

  const { data: q } = await sb.from('questions').select('*').eq('id', roundRow.question_id).single();
  currentQuestion = q;
  const { data: answers } = await sb.from('question_answers').select('*').eq('question_id', q.id).order('sort_order');
  currentQuestionAnswers = answers || [];

  const { data: players } = await sb.from('room_players').select('*').eq('room_id', currentRoom.id).order('joined_at');
  myRoomPlayer = players.find(p=>p.device_player_id===myDevicePlayerId) || myRoomPlayer;
  oppRoomPlayer = players.find(p=>p.device_player_id!==myDevicePlayerId);

  const { data: allAnswers } = await sb.from('round_answers').select('*').eq('room_round_id', roundRow.id);
  const myAns = allAnswers.filter(a=>a.room_player_id===myRoomPlayer.id);
  const oppAns = oppRoomPlayer ? allAnswers.filter(a=>a.room_player_id===oppRoomPlayer.id) : [];
  const myCorrect = myAns.filter(a=>a.is_correct).length;
  const oppCorrect = oppAns.filter(a=>a.is_correct).length;

  const isLast = currentRoom.current_round >= currentRoom.total_rounds - 1;
  const iWon = roundRow.winner_room_player_id === myRoomPlayer.id;
  const isDraw = roundRow.is_draw;
  const bannerClass = isDraw ? 'draw' : (iWon ? 'win' : 'lose');
  const bannerText = isDraw ? "الجولة تعادل 🤝" : (iWon ? "كسبت الجولة! 🔥" : "الجولة راحت للخصم 😔");

  const myMatchedIds = new Set(myAns.filter(a=>a.is_correct).map(a=>a.matched_question_answer_id));
  const oppMatchedIds = new Set(oppAns.filter(a=>a.is_correct).map(a=>a.matched_question_answer_id));

  // جلب round scores لكل الجولات لغاية دلوقتي (لعرض الشريط)
  const { data: allRounds } = await sb.from('room_rounds').select('*').eq('room_id', currentRoom.id).order('round_number');

  root.innerHTML = `
    <div class="screen">
      <div class="result-banner ${bannerClass}">
        <div class="big">${bannerText}</div>
      </div>

      <div class="score-strip">
        <div class="score-pill me"><span class="name">انت</span><span class="count">${myCorrect}</span></div>
        <span class="vs-sep">VS</span>
        <div class="score-pill opp"><span class="name">الخصم</span><span class="count">${oppCorrect}</span></div>
      </div>

      <div class="full-answers">
        <h3>كل الإجابات الصحيحة للسؤال (${currentQuestion.total_answers_count}):</h3>
        <div class="full-answers-grid">
          ${currentQuestionAnswers.map(a=>{
            let cls='fa-tag';
            if(myMatchedIds.has(a.id)) cls+=' got-me';
            else if(oppMatchedIds.has(a.id)) cls+=' got-opp';
            return `<span class="${cls}">${escapeHtml(a.canonical_name)}</span>`;
          }).join('')}
        </div>
      </div>

      <div class="rounds-track">
        ${Array.from({length: currentRoom.total_rounds}).map((_,i)=>{
          const rn = i+1;
          const rr = allRounds.find(r=>r.round_number===rn);
          if(!rr || !rr.ended_at){
            return `<div class="round-dot ${rn===currentRoom.current_round+1?'active':''}">${rn}</div>`;
          }
          let cls = 'round-dot ';
          if(rr.is_draw) cls+='done-draw';
          else if(rr.winner_room_player_id===myRoomPlayer.id) cls+='done-me';
          else cls+='done-opp';
          return `<div class="${cls}">${rn}</div>`;
        }).join('')}
      </div>

      <p class="small-note" style="margin-bottom:16px;">مجموع الجولات: انت ${myRoomPlayer.total_rounds_won||0} - الخصم ${oppRoomPlayer?(oppRoomPlayer.total_rounds_won||0):0}</p>

      <button class="btn btn-primary" id="nextBtn">${isLast ? 'شوف النتيجة النهائية 🏆' : 'الجولة الجاية ⚽'}</button>
    </div>
  `;

  document.getElementById('nextBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('nextBtn');
    btn.disabled = true; btn.textContent = "...";
    try{
      if(isLast){
        await sb.from('rooms').update({ status:'finished', updated_at: new Date().toISOString() }).eq('id', currentRoom.id);
      } else {
        const nextRoundNum = currentRoom.current_round + 2;

        // اقرأ قائمة أسئلة الماتش المخزنة في الغرفة نفسها (مش من متغير محلي ممكن يضيع)
        const { data: freshRoom } = await sb.from('rooms').select('*').eq('id', currentRoom.id).single();
        currentRoom = freshRoom;
        let questionIds = currentRoom.question_ids || [];

        // لو لأي سبب القائمة ناقصة، كمّلها
        if(questionIds.length < currentRoom.total_rounds){
          const need = currentRoom.total_rounds - questionIds.length;
          const fresh = await loadRandomQuestions(need);
          const newIds = fresh.map(f=>f.question.id).filter(id=>!questionIds.includes(id));
          questionIds = [...questionIds, ...newIds];
          await sb.from('rooms').update({ question_ids: questionIds }).eq('id', currentRoom.id);
        }

        const nextQuestionId = questionIds[nextRoundNum-1];
        if(!nextQuestionId){
          showToast("مشكلة في تجهيز السؤال، حاول تاني");
          btn.disabled=false; btn.textContent = 'الجولة الجاية ⚽';
          return;
        }

        // تأكد إن الجولة دي مش موجودة بالفعل (تفادي تكرار من اللاعبين الاتنين)
        const { data: existing } = await sb.from('room_rounds').select('id').eq('room_id', currentRoom.id).eq('round_number', nextRoundNum).maybeSingle();
        if(!existing){
          await sb.from('room_rounds').insert({
            room_id: currentRoom.id,
            round_number: nextRoundNum,
            question_id: nextQuestionId,
            started_at: new Date().toISOString()
          });
        }
        const { data: theRound } = await sb.from('room_rounds').select('*').eq('room_id', currentRoom.id).eq('round_number', nextRoundNum).single();
        await sb.from('rooms').update({
          status:'playing',
          current_round: currentRoom.current_round+1,
          round_started_at: theRound.started_at,
          updated_at: new Date().toISOString()
        }).eq('id', currentRoom.id);
      }
    }catch(err){
      console.error(err);
      showToast("حصل خطأ، حاول تاني");
      btn.disabled=false; btn.textContent = isLast ? 'شوف النتيجة النهائية 🏆' : 'الجولة الجاية ⚽';
      return;
    }
    await refreshRoomState();
  });
}

/* ---------- FINAL ---------- */
async function renderFinal(){
  const { data: players } = await sb.from('room_players').select('*').eq('room_id', currentRoom.id).order('joined_at');
  myRoomPlayer = players.find(p=>p.device_player_id===myDevicePlayerId) || myRoomPlayer;
  oppRoomPlayer = players.find(p=>p.device_player_id!==myDevicePlayerId);

  const myScore = myRoomPlayer.total_rounds_won||0;
  const oppScore = oppRoomPlayer ? (oppRoomPlayer.total_rounds_won||0) : 0;
  const iWon = myScore > oppScore;
  const draw = myScore === oppScore;

  const { data: allRounds } = await sb.from('room_rounds').select('*').eq('room_id', currentRoom.id).order('round_number');

  root.innerHTML = `
    <div class="screen">
      <div class="trophy">${draw ? '🤝' : (iWon ? '🏆' : '🥈')}</div>
      <h2 style="font-size:24px; text-align:center; margin-bottom:6px;">
        ${draw ? 'التعادل كان سيد الموقف!' : (iWon ? 'مبروك، كسبت الماتش!' : 'خسرت الماتش ده... جولة تانية؟')}
      </h2>
      <p class="small-note" style="margin-bottom:10px;">${escapeHtml(myRoomPlayer.player_name)} ضد ${oppRoomPlayer?escapeHtml(oppRoomPlayer.player_name):'؟'}</p>

      <div class="final-score-board">
        <div class="final-player ${iWon?'win':''}"><div class="num">${myScore}</div><div class="lbl">انت</div></div>
        <div class="vs-sep" style="font-size:16px;">VS</div>
        <div class="final-player ${!iWon && !draw?'win':''}"><div class="num">${oppScore}</div><div class="lbl">${oppRoomPlayer?escapeHtml(oppRoomPlayer.player_name):'؟'}</div></div>
      </div>

      <div class="rounds-track">
        ${allRounds.map(rr=>{
          let cls = 'round-dot ';
          if(rr.is_draw) cls+='done-draw';
          else if(rr.winner_room_player_id===myRoomPlayer.id) cls+='done-me';
          else cls+='done-opp';
          return `<div class="${cls}">${rr.round_number}</div>`;
        }).join('')}
      </div>

      <div class="stack" style="margin-top:16px;">
        <button class="btn btn-ghost" id="newRoomBtn">🏟️ غرفة جديدة</button>
      </div>
    </div>
  `;
  document.getElementById('newRoomBtn').addEventListener('click', leaveRoom);
}

/* ============================================================
   تحديث حالة الغرفة (يستخدم بعد أي تعديل محلي)
============================================================ */
async function refreshRoomState(){
  const { data: freshRoom } = await sb.from('rooms').select('*').eq('id', currentRoom.id).single();
  if(freshRoom) currentRoom = freshRoom;
  render();
}

/* ============================================================
   Realtime subscriptions
============================================================ */
function subscribeRealtime(roomId){
  unsubscribeRealtime();
  realtimeChannel = sb.channel('room-'+roomId)
    .on('postgres_changes', { event:'*', schema:'public', table:'rooms', filter:`id=eq.${roomId}` }, payload=>{
      currentRoom = payload.new;
      render();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'room_players', filter:`room_id=eq.${roomId}` }, payload=>{
      if(currentRoom && currentRoom.status==='waiting'){ render(); }
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'round_answers' }, payload=>{
      // تحديث لايف لعداد الخصم من غير ريفريش كامل للشاشة
      if(currentRoom && currentRoom.status==='playing'){
        updateLiveOpponentCounter();
      }
    })
    .subscribe();
}
function unsubscribeRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel=null; }
}

async function updateLiveOpponentCounter(){
  if(!currentRoomRound || !oppRoomPlayer) return;
  const { data: oppAns } = await sb.from('round_answers').select('*').eq('room_round_id', currentRoomRound.id).eq('room_player_id', oppRoomPlayer.id);
  oppAnswers = oppAns || [];
  const oppCorrect = oppAnswers.filter(a=>a.is_correct).length;
  const el1 = document.getElementById('oppCountLive');
  const el2 = document.getElementById('oppProgressNum');
  if(el1) el1.textContent = oppCorrect;
  if(el2) el2.textContent = oppCorrect;
}

/* ============================================================
   Polling احتياطي (لو Realtime تأخر أو الاتصال ضعيف)
============================================================ */
function startPolling(){
  stopPolling();
  pollTimer = setInterval(async ()=>{
    if(!currentRoom) return;
    const { data: freshRoom } = await sb.from('rooms').select('*').eq('id', currentRoom.id).single();
    if(!freshRoom) return;
    const changed = freshRoom.status !== currentRoom.status || freshRoom.current_round !== currentRoom.current_round || freshRoom.updated_at !== currentRoom.updated_at;
    currentRoom = freshRoom;
    if(changed){
      render();
    } else if(currentRoom.status==='playing'){
      await maybeResolveRound();
      updateLiveOpponentCounter();
    }
  }, 2500);
}
function stopPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = null;
  clearInterval(roundTimerInterval);
}

/* ============================================================
   init
============================================================ */
render();
</script>
